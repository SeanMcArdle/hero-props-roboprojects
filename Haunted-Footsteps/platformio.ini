[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200 ; Lowered from 921600 - this USB-serial adapter dropped bytes at the higher rate
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    esphome/ESPAsyncWebServer-esphome @ ^3.2.2
    bblanchon/ArduinoJson @ ^7.0.4

board_build.filesystem = littlefs
board_build.partitions = partitions.csv ; Custom: dual ~1.5MB OTA app slots + small LittleFS (see partitions.csv)
