<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="50" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">HeroProps System Architecture</text>
  
  <!-- Transmitter Box -->
  <rect x="50" y="100" width="400" height="400" fill="#e6f3ff" stroke="#0066cc" stroke-width="2" rx="10"/>
  <text x="250" y="130" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">SimpleCommander (Transmitter)</text>
  
  <rect x="150" y="200" width="200" height="100" fill="#333" rx="5"/>
  <text x="250" y="255" font-family="Arial" font-size="14" fill="white" text-anchor="middle">ESP32 (Mac: ...)</text>
  
  <rect x="80" y="350" width="100" height="100" fill="#ddd" stroke="black"/>
  <text x="130" y="405" font-family="Arial" font-size="12" text-anchor="middle">Left Stick</text>
  <text x="130" y="425" font-family="Arial" font-size="10" text-anchor="middle">Drive (34/35)</text>

  <rect x="320" y="350" width="100" height="100" fill="#ddd" stroke="black"/>
  <text x="370" y="405" font-family="Arial" font-size="12" text-anchor="middle">Right Stick</text>
  <text x="370" y="425" font-family="Arial" font-size="10" text-anchor="middle">Dome (33/25)</text>

  <!-- Receiver Box -->
  <rect x="550" y="100" width="400" height="400" fill="#fff0e6" stroke="#cc6600" stroke-width="2" rx="10"/>
  <text x="750" y="130" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Squad Bot (Receiver)</text>

  <rect x="650" y="200" width="200" height="100" fill="#333" rx="5"/>
  <text x="750" y="255" font-family="Arial" font-size="14" fill="white" text-anchor="middle">ESP32 (Mac: ...)</text>

  <rect x="580" y="350" width="80" height="80" fill="#444"/>
  <text x="620" y="395" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Motors</text>
  
  <rect x="680" y="350" width="80" height="80" fill="#ddd"/>
  <text x="720" y="395" font-family="Arial" font-size="12" text-anchor="middle">Dome Servo</text>
  <text x="720" y="415" font-family="Arial" font-size="10" text-anchor="middle">Pin 13</text>

  <rect x="780" y="350" width="80" height="80" fill="#666"/>
  <text x="820" y="395" font-family="Arial" font-size="12" fill="white" text-anchor="middle">DFPlayer</text>
  <text x="820" y="415" font-family="Arial" font-size="10" fill="white" text-anchor="middle">UART2 (16/17)</text>

  <!-- Wireless Link -->
  <path d="M 350 250 Q 500 150 650 250" stroke="#00cc00" stroke-width="4" stroke-dasharray="10,5" fill="none"/>
  <text x="500" y="200" font-family="Arial" font-size="14" fill="#009900" text-anchor="middle" font-weight="bold">ESP-NOW (2.4GHz)</text>

</svg>