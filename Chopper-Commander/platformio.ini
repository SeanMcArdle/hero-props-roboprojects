; PlatformIO Project Configuration
; Unified Droid Controller - Chopper + BB Workshop Droids
;
; To flash via USB:  pio run -t upload
; To flash via OTA:  pio run -t upload --upload-port [IP_ADDRESS]
;
; Chopper OTA:  pio run -t upload --upload-port 192.168.4.1
; (Connect to CHOPPER WiFi first)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    madhephaestus/ESP32Servo@^1.2.0
    me-no-dev/AsyncTCP@^1.1.1
    https://github.com/me-no-dev/ESPAsyncWebServer.git

; OTA settings
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --port=3232
    --auth=

; For initial USB flash, comment out the 3 lines above and uncomment:
; upload_protocol = esptool
; upload_port = /dev/ttyUSB0  ; or COM3 on Windows

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0