<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f0f0f0"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">SimpleCommander Wiring (Transmitter)</text>
  
  <!-- ESP32 Board -->
  <rect x="300" y="200" width="200" height="300" fill="#333" rx="10"/>
  <text x="400" y="230" font-family="Arial" font-size="16" fill="white" text-anchor="middle">ESP32 NodeMCU</text>
  
  <!-- Left Joystick (Drive) -->
  <rect x="50" y="200" width="150" height="150" fill="#ddd" stroke="black"/>
  <text x="125" y="225" font-family="Arial" font-size="14" text-anchor="middle">Left Joystick (Drive)</text>
  <text x="125" y="245" font-family="Arial" font-size="12" text-anchor="middle">VRx (Speed) -> GPIO 34</text>
  <text x="125" y="265" font-family="Arial" font-size="12" text-anchor="middle">VRy (Turn) -> GPIO 35</text>
  <text x="125" y="285" font-family="Arial" font-size="12" text-anchor="middle">SW (Horn) -> GPIO 32</text>
  
  <!-- Right Joystick (Dome) -->
  <rect x="600" y="200" width="150" height="150" fill="#ddd" stroke="black"/>
  <text x="675" y="225" font-family="Arial" font-size="14" text-anchor="middle">Right Joystick (Dome)</text>
  <text x="675" y="245" font-family="Arial" font-size="12" text-anchor="middle">VRx (Spin) -> GPIO 33</text>
  <text x="675" y="265" font-family="Arial" font-size="12" text-anchor="middle">VRy (Tilt) -> GPIO 25</text>
  <text x="675" y="285" font-family="Arial" font-size="12" text-anchor="middle">SW (Mode) -> GPIO 26</text>

  <!-- Wires Left -->
  <line x1="200" y1="240" x2="300" y2="240" stroke="orange" stroke-width="3"/> <!-- 34 -->
  <line x1="200" y1="260" x2="300" y2="260" stroke="blue" stroke-width="3"/> <!-- 35 -->
  <line x1="200" y1="280" x2="300" y2="280" stroke="green" stroke-width="3"/> <!-- 32 -->

  <!-- Wires Right -->
  <line x1="600" y1="240" x2="500" y2="240" stroke="orange" stroke-width="3"/> <!-- 33 -->
  <line x1="600" y1="260" x2="500" y2="260" stroke="blue" stroke-width="3"/> <!-- 25 -->
  <line x1="600" y1="280" x2="500" y2="280" stroke="green" stroke-width="3"/> <!-- 26 -->

  <!-- Power -->
  <text x="400" y="550" font-family="Arial" font-size="14" text-anchor="middle">Power: USB or VIN (5V)</text>
</svg>