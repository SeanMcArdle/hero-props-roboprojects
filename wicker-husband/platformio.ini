; =========================================================================
; 🪆 WICKER HUSBAND — Animatronic Eyes (ESP32 Hero Props Proptocols)
; Adapted from mklements/AIChatbot EyeMovement.py (Raspberry Pi / PCA9685)
; =========================================================================
[env:wicker-husband]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    https://github.com/SeanMcArdle/HeroPropsProtocol.git
    madhephaestus/ESP32Servo @ ^1.1.0
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1

[env:wicker-husband-ota]
extends = env:wicker-husband
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=heroprops
