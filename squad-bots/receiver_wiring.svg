<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f0f0f0"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Squad Bot Receiver Wiring (JL-BN)</text>
  
  <!-- ESP32 Board -->
  <rect x="300" y="150" width="200" height="300" fill="#333" rx="10"/>
  <text x="400" y="180" font-family="Arial" font-size="16" fill="white" text-anchor="middle">ESP32 NodeMCU</text>
  
  <!-- Motor Driver -->
  <rect x="50" y="150" width="150" height="200" fill="#444" stroke="black"/>
  <text x="125" y="180" font-family="Arial" font-size="14" fill="white" text-anchor="middle">L298N / Motor Driver</text>
  <text x="125" y="210" font-family="Arial" font-size="12" fill="white" text-anchor="middle">IN1 -> GPIO 25</text>
  <text x="125" y="230" font-family="Arial" font-size="12" fill="white" text-anchor="middle">IN2 -> GPIO 26</text>
  <text x="125" y="250" font-family="Arial" font-size="12" fill="white" text-anchor="middle">IN3 -> GPIO 27</text>
  <text x="125" y="270" font-family="Arial" font-size="12" fill="white" text-anchor="middle">IN4 -> GPIO 14</text>

  <!-- Dome Servo -->
  <rect x="600" y="150" width="100" height="80" fill="#ddd" stroke="black"/>
  <text x="650" y="180" font-family="Arial" font-size="14" text-anchor="middle">Dome Servo</text>
  <text x="650" y="200" font-family="Arial" font-size="12" text-anchor="middle">Signal -> GPIO 13</text>

  <!-- DFPlayer Mini -->
  <rect x="600" y="300" width="100" height="100" fill="#666" stroke="black"/>
  <text x="650" y="330" font-family="Arial" font-size="14" fill="white" text-anchor="middle">DFPlayer Mini</text>
  <text x="650" y="350" font-family="Arial" font-size="12" fill="white" text-anchor="middle">RX -> GPIO 17 (TX2)</text>
  <text x="650" y="370" font-family="Arial" font-size="12" fill="white" text-anchor="middle">TX -> GPIO 16 (RX2)</text>

  <!-- Wires Left -->
  <line x1="200" y1="210" x2="300" y2="210" stroke="red" stroke-width="3"/>
  <line x1="200" y1="230" x2="300" y2="230" stroke="black" stroke-width="3"/>
  <line x1="200" y1="250" x2="300" y2="250" stroke="red" stroke-width="3"/>
  <line x1="200" y1="270" x2="300" y2="270" stroke="black" stroke-width="3"/>

  <!-- Wires Right -->
  <line x1="600" y1="200" x2="500" y2="200" stroke="orange" stroke-width="3"/> <!-- Servo -->
  <line x1="600" y1="350" x2="500" y2="350" stroke="blue" stroke-width="3"/> <!-- TX2 -->
  <line x1="600" y1="370" x2="500" y2="370" stroke="green" stroke-width="3"/> <!-- RX2 -->

</svg>