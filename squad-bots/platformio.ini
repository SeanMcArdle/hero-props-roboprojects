; =========================================================================
; 🤖 L0-0N — New Baseline (Bakken Spring Break 2026)
; =========================================================================
[env:l0-0n]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    https://github.com/SeanMcArdle/HeroPropsProtocol.git
    madhephaestus/ESP32Servo @ ^1.1.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D BOT_ID=1
    -D BOARD_VARIANT_NODEMCU_32S

[env:l0-0n-devkit]
extends = env:l0-0n
board = esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D BOT_ID=1
    -D BOARD_VARIANT_ESP32_DEVKIT

[env:l0-0n-devkit-test]
extends = env:l0-0n-devkit
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D BOT_ID=1
    -D BOARD_VARIANT_ESP32_DEVKIT
    -D TEST_PIN_MODE

[env:l0-0n-ota]
extends = env:l0-0n
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=heroprops

[env:l0-0n-devkit-ota]
extends = env:l0-0n-devkit
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=heroprops

[env:blink-devkit]
extends = env:l0-0n-devkit
board = esp32dev
; Build only the small blink test source to avoid linking the full firmware
src_filter = +<src/blink_test.cpp>

[env:blink-minimal]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Only compile the blink-related sources and avoid external libs
build_src_filter = +<src/blink_test.cpp> +<src/main_blink.cpp>
lib_deps =
build_flags =
    -D BOARD_VARIANT_ESP32_DEVKIT

